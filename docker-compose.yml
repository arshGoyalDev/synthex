services:
  postgres:
    image: postgres:17-alpine
    container_name: synthex-postgres
    profiles: ["infra", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - synthex-network

  redis:
    image: redis:7-alpine
    container_name: synthex-redis
    profiles: ["infra", "full"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - synthex-network

  minio:
    image: minio/minio:latest
    container_name: synthex-minio
    profiles: ["infra", "full"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - synthex-network

  minio-setup:
    image: minio/mc:latest
    container_name: synthex-minio-setup
    profiles: ["infra", "full"]
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY}; do sleep 2; done
        /usr/bin/mc mb myminio/user-files --ignore-existing
        /usr/bin/mc mb myminio/project-files --ignore-existing
        /usr/bin/mc mb myminio/project-zips --ignore-existing
        /usr/bin/mc mb myminio/execution-outputs --ignore-existing
    restart: "no"
    networks:
      - synthex-network

  migrate:
    build:
      context: .
      dockerfile: packages/database/Dockerfile.migrate
    container_name: synthex-migrate
    profiles: ["full"]
    environment:
      NODE_ENV: production
      PRISMA_DEBUG: ${PRISMA_DEBUG}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@synthex-postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - synthex-network

  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    container_name: synthex-project-service
    profiles: ["full"]
    environment:
      NODE_ENV: production
      PORT: ${PROJECT_SERVICE_PORT}
      ORIGIN: ${ORIGIN}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@synthex-postgres:5432/${POSTGRES_DB}?schema=public
      PRISMA_DEBUG: ${PRISMA_DEBUG}
      REDIS_HOST: synthex-redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PROJECT_SERVICE_PORT}:${PROJECT_SERVICE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PROJECT_SERVICE_PORT}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - synthex-network
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: synthex-user-service
    profiles: ["full"]
    environment:
      NODE_ENV: production
      PORT: ${USER_SERVICE_PORT}
      ORIGIN: ${ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRATION: ${ACCESS_TOKEN_EXPIRATION}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      GITHUB_TOKEN_SECRET: ${GITHUB_TOKEN_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@synthex-postgres:5432/${POSTGRES_DB}?schema=public
      PRISMA_DEBUG: ${PRISMA_DEBUG}
      REDIS_HOST: synthex-redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      project-service:
        condition: service_healthy
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${USER_SERVICE_PORT}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - synthex-network
    restart: unless-stopped

  container-service:
    build:
      context: .
      dockerfile: services/container-service/Dockerfile
    container_name: synthex-container-service
    profiles: ["full"]
    environment:
      NODE_ENV: production
      PORT: ${CONTAINER_SERVICE_PORT}
      ORIGIN: ${ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@synthex-postgres:5432/${POSTGRES_DB}?schema=public
      PRISMA_DEBUG: ${PRISMA_DEBUG}
      REDIS_HOST: synthex-redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: synthex-minio
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_USER_FILES_BUCKET: ${MINIO_USER_FILES_BUCKET}
      MINIO_PROJECT_FILES_BUCKET: ${MINIO_PROJECT_FILES_BUCKET}
      MINIO_EXECUTION_OUTPUTS_BUCKET: ${MINIO_EXECUTION_OUTPUTS_BUCKET}
      USER_SERVICE_URL: http://synthex-user-service:${USER_SERVICE_PORT}
      PROJECT_SERVICE_URL: http://synthex-project-service:${PROJECT_SERVICE_PORT}
      EXECUTION_SERVICE_URL: http://synthex-execution-service:${EXECUTION_SERVICE_PORT}
      STORAGE_SERVICE_URL: http://synthex-storage-service:${STORAGE_SERVICE_PORT}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      project-service:
        condition: service_healthy
    ports:
      - "${CONTAINER_SERVICE_PORT}:${CONTAINER_SERVICE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${CONTAINER_SERVICE_PORT}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - synthex-network
    restart: unless-stopped

  execution-service:
    build:
      context: .
      dockerfile: services/execution-service/Dockerfile
    container_name: synthex-execution-service
    profiles: ["full"]
    environment:
      NODE_ENV: production
      PORT: ${EXECUTION_SERVICE_PORT}
      ORIGIN: ${ORIGIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@synthex-postgres:5432/${POSTGRES_DB}?schema=public
      PRISMA_DEBUG: ${PRISMA_DEBUG}
      REDIS_HOST: synthex-redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      project-service:
        condition: service_healthy
    ports:
      - "${EXECUTION_SERVICE_PORT}:${EXECUTION_SERVICE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${EXECUTION_SERVICE_PORT}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - synthex-network
    restart: unless-stopped

  storage-service:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    container_name: synthex-storage-service
    profiles: ["full"]
    environment:
      NODE_ENV: production
      PORT: ${STORAGE_SERVICE_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@synthex-postgres:5432/${POSTGRES_DB}?schema=public
      PRISMA_DEBUG: ${PRISMA_DEBUG}
      REDIS_HOST: synthex-redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: synthex-minio
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_USER_FILES_BUCKET: ${MINIO_USER_FILES_BUCKET}
      MINIO_PROJECT_FILES_BUCKET: ${MINIO_PROJECT_FILES_BUCKET}
      MINIO_EXECUTION_OUTPUTS_BUCKET: ${MINIO_EXECUTION_OUTPUTS_BUCKET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
      project-service:
        condition: service_healthy
    ports:
      - "${STORAGE_SERVICE_PORT}:${STORAGE_SERVICE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${STORAGE_SERVICE_PORT}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - synthex-network
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: apps/api_gateway/Dockerfile
    container_name: synthex-api-gateway
    profiles: ["full"]
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: ${API_GATEWAY_PORT}
      ORIGIN: ${ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: synthex-redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      USER_SERVICE_URL: http://synthex-user-service:${USER_SERVICE_PORT}
      PROJECT_SERVICE_URL: http://synthex-project-service:${PROJECT_SERVICE_PORT}
      CONTAINER_SERVICE_URL: http://synthex-container-service:${CONTAINER_SERVICE_PORT}
      EXECUTION_SERVICE_URL: http://synthex-execution-service:${EXECUTION_SERVICE_PORT}
      STORAGE_SERVICE_URL: http://synthex-storage-service:${STORAGE_SERVICE_PORT}
    depends_on:
      user-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      container-service:
        condition: service_healthy
      execution-service:
        condition: service_healthy
      storage-service:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${API_GATEWAY_PORT}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - synthex-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL}
    container_name: synthex-web
    profiles: ["full"]
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - synthex-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  synthex-network:
    driver: bridge
