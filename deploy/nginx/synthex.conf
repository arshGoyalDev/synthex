# Host-VM Nginx config for the Docker Compose setup.
# Assumes Docker publishes:
# - web          -> 127.0.0.1:8080
# - api-gateway  -> 127.0.0.1:3000
#
# Replace `synthex.example.com` with your real domain.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream synthex_web {
  server 127.0.0.1:8080;
  keepalive 32;
}

upstream synthex_api {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name synthex.example.com;

  client_max_body_size 250m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location /api/ {
    proxy_pass http://synthex_api;
    proxy_read_timeout 300s;
  }

  location /socket.io/ {
    proxy_pass http://synthex_api;
    proxy_read_timeout 300s;
  }

  location /terminal/ {
    proxy_pass http://synthex_api;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location /preview/ {
    proxy_pass http://synthex_api;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://synthex_web;
    proxy_read_timeout 60s;
  }
}
